[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "answerpg"
version = "0.1.0"
description = "Cited answers over your own docs from PostgreSQL + pgvector: SQL BM25, vector search, rank fusion, reranking and a CI quality gate"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.3",
    "fastapi>=0.162",
    "fastembed>=0.9",
    "numpy>=2.0",
    "pgvector>=0.5",
    "psycopg[binary,pool]>=3.3",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "uvicorn[standard]>=0.54",
]

[project.optional-dependencies]
dev = ["httpx>=0.28", "pytest>=9.1", "ruff>=0.17"]

[tool.setuptools.packages.find]
include = ["answerpg*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
