name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://answerpg:answerpg@localhost:5432/answerpg

jobs:
  unit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: answerpg
          POSTGRES_PASSWORD: answerpg
          POSTGRES_DB: answerpg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U answerpg -d answerpg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/cache@v6
        with:
          path: .cache/models
          key: encoders-${{ hashFiles('answerpg/settings.py') }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  quality:
    needs: unit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: answerpg
          POSTGRES_PASSWORD: answerpg
          POSTGRES_DB: answerpg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U answerpg -d answerpg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/cache@v6
        with:
          path: .cache/models
          key: encoders-${{ hashFiles('answerpg/settings.py') }}
      - run: pip install -e ".[dev]"
      - run: python scripts/index_corpus.py
      - run: python -m evaluation.gate --compare
      - name: Add the quality report to the job summary
        if: always()
        run: |
          if [ -f evaluation/results.md ]; then cat evaluation/results.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: quality-report
          path: evaluation/results.md
